version: 2
updates:
  # Python dependencies (uv ecosystem — updates pyproject.toml + uv.lock together)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "python"
    groups:
      verification-runtime:
        patterns:
          - "agent-framework-*"
          - "openai"
      auth-runtime:
        patterns:
          - "authlib"
          - "fastapi"
          - "httpx*"
          - "itsdangerous"
          - "starlette"
      database-runtime:
        patterns:
          - "alembic"
          - "asyncpg"
          - "sqlalchemy"
      python-all:
        patterns:
          - "*"
        exclude-patterns:
          - "agent-framework-*"
          - "openai"
          - "authlib"
          - "fastapi"
          - "httpx*"
          - "itsdangerous"
          - "starlette"
          - "alembic"
          - "asyncpg"
          - "sqlalchemy"
      # Groups above only cover version updates; without this, every security
      # fix (including transitive packages) opens its own pull request.
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # npm dependencies (Tailwind CSS)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-all:
        patterns:
          - "*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

# Terraform provider upgrades are handled manually after a production-state plan.
