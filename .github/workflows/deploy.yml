name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - 'scripts/verify_production.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      plan_only:
        description: Plan Terraform without applying or deploying
        required: false
        default: false
        type: boolean
      force_rebuild:
        description: Rebuild and redeploy the API without cache
        required: false
        default: false
        type: boolean

# One production deploy at a time. Each run releases the latest main, so a
# waiting run replaced by a newer one loses nothing. Plan-only runs get their
# own group so they never replace a waiting deploy.
concurrency:
  group: ${{ inputs.plan_only && 'production-plan' || 'production-deploy' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_environment: ${{ vars.AZURE_ENV_NAME }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_USE_OIDC: true
  PLAN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only }}
  FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate deployment context
        run: |
          set -euo pipefail
          if [[ "$PLAN_ONLY" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is allowed only from main." >&2
            exit 1
          fi
          : "${AZURE_ENV_NAME:?AZURE_ENV_NAME repository variable is required}"
          : "${AZURE_LOCATION:?AZURE_LOCATION repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PLAN_ONLY == 'true' && github.sha || 'refs/heads/main' }}
          fetch-depth: 0

      # Release the latest main rather than the triggering commit, so a run
      # that starts late can never roll production back to an older commit.
      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Releasing latest main $sha (triggered by $GITHUB_SHA)."
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Azure CLI Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config="key=learn-to-cloud-${AZURE_ENV_NAME}.tfstate"

      - name: Terraform Plan
        id: plan
        working-directory: infra
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_github_client_id: ${{ secrets.TF_VAR_GITHUB_CLIENT_ID }}
          TF_VAR_postgres_entra_admin_object_id: ${{ vars.POSTGRES_ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_postgres_entra_admin_principal_name: ${{ vars.POSTGRES_ENTRA_ADMIN_PRINCIPAL_NAME }}
          TF_VAR_postgres_entra_admin_principal_type: ${{ vars.POSTGRES_ENTRA_ADMIN_PRINCIPAL_TYPE || 'Group' }}
        run: |
          set -uo pipefail
          code=0
          terraform plan -out=tfplan -input=false -lock-timeout=120s -detailed-exitcode || code=$?
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - name: Terraform Apply
        if: env.PLAN_ONLY != 'true' && steps.plan.outputs.changes == 'true'
        working-directory: infra
        run: terraform apply -auto-approve -lock-timeout=120s tfplan

      - name: Read Terraform outputs
        if: env.PLAN_ONLY != 'true'
        id: context
        working-directory: infra
        run: |
          set -euo pipefail
          outputs=$(terraform output -json)

          publish_output() {
            local output_name=$1
            local terraform_name=$2
            local value
            value=$(jq -r --arg name "$terraform_name" '.[$name].value // empty' <<<"$outputs")
            if [[ -z "$value" ]]; then
              echo "::error::Terraform output $terraform_name is empty." >&2
              exit 1
            fi
            printf '%s=%s\n' "$output_name" "$value" >> "$GITHUB_OUTPUT"
          }

          publish_output api_container_app_name api_container_app_name
          publish_output resource_group_name AZURE_RESOURCE_GROUP
          publish_output container_registry_name AZURE_CONTAINER_REGISTRY_NAME
          publish_output container_registry_endpoint AZURE_CONTAINER_REGISTRY_ENDPOINT
          publish_output database_host database_host
          publish_output database_name postgres_database_name
          publish_output migration_job_name migration_job_name
          publish_output migration_identity_client_id migration_identity_client_id
          publish_output migration_identity_id migration_identity_id
          publish_output migration_postgres_role migration_postgres_role
          publish_output api_postgres_role api_postgres_role
          publish_output api_url api_url

      # Compare against the commit production runs, not this push's changed
      # files, so changes from a replaced waiting run are still released.
      - name: Decide API release
        if: env.PLAN_ONLY != 'true'
        id: app
        env:
          APP_NAME: ${{ steps.context.outputs.api_container_app_name }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          REGISTRY: ${{ steps.context.outputs.container_registry_endpoint }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          current_image=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.template.containers[?name=='api'] | [0].image" \
            --output tsv)
          deployed_sha=${current_image##*:}
          echo "Production runs $current_image"

          release=true
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "Forced rebuild requested."
          elif ! git cat-file -e "${deployed_sha}^{commit}" 2>/dev/null; then
            echo "Deployed tag is not a main commit; releasing."
          elif git diff --quiet "$deployed_sha" "$RELEASE_SHA" -- \
            src Dockerfile package.json package-lock.json pyproject.toml uv.lock \
            .dockerignore .github/workflows/deploy.yml; then
            echo "No application changes since $deployed_sha."
            release=false
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ "$release" == "true" ]]; then
            echo "expected_image=$REGISTRY/api:$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "expected_image=$current_image" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ACR
        if: steps.app.outputs.release == 'true'
        env:
          REGISTRY: ${{ steps.context.outputs.container_registry_name }}
        run: az acr login --name "$REGISTRY"

      - name: Set up Docker Buildx
        if: steps.app.outputs.release == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push API image
        if: steps.app.outputs.release == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: api-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.context.outputs.container_registry_endpoint }}/api:${{ steps.release.outputs.sha }}
          labels: git-commit=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-runtime,mode=max
          # Keep the deployable manifest compatible with Azure Container Apps.
          provenance: false
          no-cache: ${{ env.FORCE_REBUILD == 'true' }}
          pull: ${{ env.FORCE_REBUILD == 'true' }}

      - name: Build and push migrations image
        if: steps.app.outputs.release == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: migrations-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.context.outputs.container_registry_endpoint }}/migrations:${{ steps.release.outputs.sha }}
          labels: git-commit=${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=migrations-runtime
          cache-to: type=gha,scope=migrations-runtime,mode=max
          # Keep the deployable manifest compatible with Azure Container Apps.
          provenance: false
          no-cache: ${{ env.FORCE_REBUILD == 'true' }}
          pull: ${{ env.FORCE_REBUILD == 'true' }}

      # Terraform's container templates reference :latest, so promote only
      # images that pass the runtime package check.
      - name: Validate and promote runtime images
        if: steps.app.outputs.release == 'true'
        env:
          REGISTRY: ${{ steps.context.outputs.container_registry_endpoint }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker run --rm "$REGISTRY/api:$RELEASE_SHA" \
            python -m learn_to_cloud.runtime_package_check

          docker run --rm -i \
            "$REGISTRY/migrations:$RELEASE_SHA" \
            python - <<'PY'
          from learn_to_cloud.runtime_package_check import main

          main()
          PY

          for image in api migrations; do
            docker buildx imagetools create \
              --tag "$REGISTRY/$image:latest" "$REGISTRY/$image:$RELEASE_SHA"
          done

      - name: Run database migrations
        if: steps.app.outputs.release == 'true'
        env:
          MIGRATION_JOB_NAME: ${{ steps.context.outputs.migration_job_name }}
          MIGRATION_CLIENT_ID: ${{ steps.context.outputs.migration_identity_client_id }}
          MIGRATION_IDENTITY_ID: ${{ steps.context.outputs.migration_identity_id }}
          DATABASE_NAME: ${{ steps.context.outputs.database_name }}
          DATABASE_HOST: ${{ steps.context.outputs.database_host }}
          DATABASE_USER: ${{ steps.context.outputs.migration_postgres_role }}
          POSTGRES_API_RUNTIME_ROLE: ${{ steps.context.outputs.api_postgres_role }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          IMAGE: ${{ steps.context.outputs.container_registry_endpoint }}/migrations:${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt

          execution_name=$(
            az containerapp job start \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --container-name migrations \
              --image "$IMAGE" \
              --command learn-to-cloud-migrate \
              --env-vars \
                DATABASE__HOST="$DATABASE_HOST" \
                DATABASE__USER="$DATABASE_USER" \
                DATABASE__NAME="$DATABASE_NAME" \
                AZURE_CLIENT_ID="$MIGRATION_CLIENT_ID" \
                POSTGRES_API_RUNTIME_ROLE="$POSTGRES_API_RUNTIME_ROLE" \
              --registry-identity "$MIGRATION_IDENTITY_ID" \
              --query name \
              --output tsv
          )
          echo "Started migration job execution: $execution_name"

          for _ in {1..180}; do
            status=$(
              az containerapp job execution show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --job-execution-name "$execution_name" \
                --query "properties.status" \
                --output tsv
            )
            echo "Migration job status: $status"

            if [[ "$status" == "Succeeded" ]]; then
              exit 0
            fi
            if [[ "$status" =~ ^(Failed|Canceled|Cancelled)$ ]]; then
              az containerapp job logs show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --container migrations \
                --execution "$execution_name" \
                --tail 100 \
                --format text || true
              exit 1
            fi

            sleep 10
          done

          echo "Migration job did not complete before timeout."
          az containerapp job logs show \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container migrations \
            --execution "$execution_name" \
            --tail 100 \
            --format text || true
          exit 1

      - name: Deploy to Container App
        if: steps.app.outputs.release == 'true'
        env:
          APP_NAME: ${{ steps.context.outputs.api_container_app_name }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          IMAGE: ${{ steps.app.outputs.expected_image }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name api \
            --image "$IMAGE"

      - name: Verify production
        if: env.PLAN_ONLY != 'true'
        env:
          APP_NAME: ${{ steps.context.outputs.api_container_app_name }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          API_URL: ${{ steps.context.outputs.api_url }}
          EXPECTED_IMAGE: ${{ steps.app.outputs.expected_image }}
        run: scripts/verify_production.sh
