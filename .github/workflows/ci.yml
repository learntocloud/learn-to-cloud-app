name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  code:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: learntocloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5432/learntocloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Static checks, generated-artifact drift, package smoke, and tests
      # (including migration head, upgrade, and model/DDL sync).
      - name: Quality gate
        run: uv run poe check

      # Needs git history, so it runs only in CI. Runs after the gate because it
      # rewrites curriculum.json, which would hide drift from the gate's hooks.
      - name: Check curriculum_version against the base commit
        env:
          PRIOR_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous-curriculum.json"
          if git show "${PRIOR_SHA}:src/learn_to_cloud/content/curriculum.json" > "$previous" 2>/dev/null; then
            uv run python scripts/compile_curriculum.py --previous-artifact "$previous"
          else
            echo "No prior curriculum.json at ${PRIOR_SHA:-<none>}; skipping version check."
          fi


  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform tests
        run: terraform test -no-color

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
