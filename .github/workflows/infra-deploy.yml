name: Infrastructure Deploy

on:
  workflow_call:
    inputs:
      apply:
        description: Apply the saved plan to production
        required: false
        default: false
        type: boolean
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      TF_VAR_GITHUB_CLIENT_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_environment: ${{ vars.AZURE_ENV_NAME }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_USE_OIDC: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate deployment context
        working-directory: .
        env:
          APPLY: ${{ inputs.apply || false }}
        run: |
          set -euo pipefail
          : "${AZURE_ENV_NAME:?AZURE_ENV_NAME repository variable is required}"
          : "${AZURE_LOCATION:?AZURE_LOCATION repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"
          if [[ "$APPLY" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Terraform apply is allowed only from main." >&2
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Azure CLI Login for deployment
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="key=learn-to-cloud-${AZURE_ENV_NAME}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Tests
        run: terraform test -no-color

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false -lock-timeout=120s
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_github_client_id: ${{ secrets.TF_VAR_GITHUB_CLIENT_ID }}
          TF_VAR_postgres_entra_admin_object_id: ${{ vars.POSTGRES_ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_postgres_entra_admin_principal_name: ${{ vars.POSTGRES_ENTRA_ADMIN_PRINCIPAL_NAME }}
          TF_VAR_postgres_entra_admin_principal_type: ${{ vars.POSTGRES_ENTRA_ADMIN_PRINCIPAL_TYPE || 'Group' }}

      - name: Terraform Apply
        if: inputs.apply && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -lock-timeout=120s tfplan
