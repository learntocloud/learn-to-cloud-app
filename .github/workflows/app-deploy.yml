name: Application Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'infra/**'
      - 'packages/learn-to-cloud-shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/infra-deploy.yml'
      - '.github/workflows/app-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        default: application
        type: choice
        options:
          - application
          - infrastructure
          - all
      force_rebuild:
        description: Force rebuild without cache
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'infrastructure' || github.event_name != 'workflow_dispatch' && steps.filter.outputs.app == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'application' || github.event_name != 'workflow_dispatch' && steps.filter.outputs.infra == 'true' }}
    steps:
      - name: Validate deployment context
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment is allowed only from main." >&2
            exit 1
          fi
          : "${AZURE_ENV_NAME:?AZURE_ENV_NAME repository variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID repository variable is required}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect deployment changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - 'api/**'
              - 'packages/learn-to-cloud-shared/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.dockerignore'
              - '.github/workflows/app-deploy.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/infra-deploy.yml'

  quality:
    needs: [changes]
    uses: ./.github/workflows/ci.yml
    with:
      force_all: ${{ github.event_name == 'workflow_dispatch' }}

  infrastructure:
    needs: [changes, quality]
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infra-deploy.yml
    with:
      apply: true
    secrets: inherit

  deploy:
    name: ${{ needs.changes.outputs.app == 'true' && 'Deploy application' || 'Verify infrastructure' }}
    if: >-
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped') &&
      (needs.changes.outputs.app == 'true' ||
       needs.changes.outputs.infra == 'true')
    needs: [changes, quality, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Azure CLI Login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config="key=learn-to-cloud-${AZURE_ENV_NAME}.tfstate"

      - name: Read Terraform outputs
        id: context
        working-directory: infra
        run: |
          set -euo pipefail

          publish_output() {
            local output_name=$1
            local terraform_name=$2
            local value
            value=$(terraform output -raw "$terraform_name")
            if [[ -z "$value" ]]; then
              echo "::error::Terraform output $terraform_name is empty." >&2
              exit 1
            fi
            printf '%s=%s\n' "$output_name" "$value" >> "$GITHUB_OUTPUT"
          }

          publish_output api_container_app_name api_container_app_name
          publish_output resource_group_name AZURE_RESOURCE_GROUP
          publish_output container_registry_name AZURE_CONTAINER_REGISTRY_NAME
          publish_output container_registry_endpoint AZURE_CONTAINER_REGISTRY_ENDPOINT
          publish_output database_host database_host
          publish_output database_name postgres_database_name
          publish_output migration_job_name migration_job_name
          publish_output migration_identity_client_id migration_identity_client_id
          publish_output migration_identity_id migration_identity_id
          publish_output migration_postgres_role migration_postgres_role
          publish_output api_postgres_role api_postgres_role
          publish_output verification_functions_postgres_role verification_functions_postgres_role
          publish_output api_url api_url
          publish_output smoke_auth_scope smoke_auth_scope

      - name: Log in to ACR
        if: needs.changes.outputs.app == 'true'
        env:
          REGISTRY: ${{ steps.context.outputs.container_registry_name }}
        run: az acr login --name "$REGISTRY"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build API image for validation
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          target: api-runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.context.outputs.container_registry_endpoint }}/api:${{ github.sha }}
          labels: git-commit=${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,scope=api-runtime,mode=max
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == 'true' }}
          pull: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == 'true' }}

      - name: Build migrations image for validation
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          target: migrations-runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.context.outputs.container_registry_endpoint }}/migrations:${{ github.sha }}
          labels: git-commit=${{ github.sha }}
          cache-from: type=gha,scope=migrations-runtime
          cache-to: type=gha,scope=migrations-runtime,mode=max
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == 'true' }}
          pull: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == 'true' }}

      - name: Validate runtime images
        if: needs.changes.outputs.app == 'true'
        env:
          REGISTRY: ${{ steps.context.outputs.container_registry_endpoint }}
        run: |
          set -euo pipefail
          docker run --rm "$REGISTRY/api:$GITHUB_SHA" \
            python -m learn_to_cloud_shared.runtime_package_check

          docker run --rm -i \
            "$REGISTRY/migrations:$GITHUB_SHA" \
            python - <<'PY'
          from learn_to_cloud_shared.runtime_package_check import main

          main()
          PY

      - name: Publish API image
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          target: api-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.context.outputs.container_registry_endpoint }}/api:${{ github.sha }}
            ${{ steps.context.outputs.container_registry_endpoint }}/api:latest
          labels: git-commit=${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          # Keep the deployable manifest compatible with Azure Container Apps.
          provenance: false
          # Reuse the smoke-tested build result instead of resolving new base images.
          no-cache: false
          pull: false

      - name: Publish migrations image
        if: needs.changes.outputs.app == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          target: migrations-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.context.outputs.container_registry_endpoint }}/migrations:${{ github.sha }}
            ${{ steps.context.outputs.container_registry_endpoint }}/migrations:latest
          labels: git-commit=${{ github.sha }}
          cache-from: type=gha,scope=migrations-runtime
          # Keep the deployable manifest compatible with Azure Container Apps.
          provenance: false
          # Reuse the smoke-tested build result instead of resolving new base images.
          no-cache: false
          pull: false

      - name: Run database migrations
        if: needs.changes.outputs.app == 'true'
        env:
          MIGRATION_JOB_NAME: ${{ steps.context.outputs.migration_job_name }}
          MIGRATION_CLIENT_ID: ${{ steps.context.outputs.migration_identity_client_id }}
          MIGRATION_IDENTITY_ID: ${{ steps.context.outputs.migration_identity_id }}
          DATABASE_NAME: ${{ steps.context.outputs.database_name }}
          DATABASE_HOST: ${{ steps.context.outputs.database_host }}
          DATABASE_USER: ${{ steps.context.outputs.migration_postgres_role }}
          POSTGRES_API_RUNTIME_ROLE: ${{ steps.context.outputs.api_postgres_role }}
          POSTGRES_VERIFICATION_FUNCTIONS_ROLE: ${{ steps.context.outputs.verification_functions_postgres_role }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          IMAGE: ${{ steps.context.outputs.container_registry_endpoint }}/migrations:${{ github.sha }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt

          execution_name=$(
            az containerapp job start \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --container-name migrations \
              --image "$IMAGE" \
              --command python \
              --args scripts/run_migrations.py \
              --env-vars \
                DATABASE__HOST="$DATABASE_HOST" \
                DATABASE__USER="$DATABASE_USER" \
                DATABASE__NAME="$DATABASE_NAME" \
                AZURE_CLIENT_ID="$MIGRATION_CLIENT_ID" \
                POSTGRES_API_RUNTIME_ROLE="$POSTGRES_API_RUNTIME_ROLE" \
                POSTGRES_VERIFICATION_FUNCTIONS_ROLE="$POSTGRES_VERIFICATION_FUNCTIONS_ROLE" \
              --registry-identity "$MIGRATION_IDENTITY_ID" \
              --query name \
              --output tsv
          )
          echo "Started migration job execution: $execution_name"

          for i in {1..180}; do
            status=$(
              az containerapp job execution show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --job-execution-name "$execution_name" \
                --query "properties.status" \
                --output tsv
            )
            echo "Migration job status: $status"

            if [[ "$status" == "Succeeded" ]]; then
              exit 0
            fi
            if [[ "$status" =~ ^(Failed|Canceled|Cancelled)$ ]]; then
              az containerapp job logs show \
                --name "$MIGRATION_JOB_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --container migrations \
                --execution "$execution_name" \
                --tail 100 \
                --format text || true
              exit 1
            fi

            sleep 10
          done

          echo "Migration job did not complete before timeout."
          az containerapp job logs show \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container migrations \
            --execution "$execution_name" \
            --tail 100 \
            --format text || true
          exit 1

      - name: Deploy to Container App
        if: needs.changes.outputs.app == 'true'
        env:
          APP_NAME: ${{ steps.context.outputs.api_container_app_name }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          IMAGE: ${{ steps.context.outputs.container_registry_endpoint }}/api:${{ github.sha }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name api \
            --image "$IMAGE"

      - name: Verify production readiness
        timeout-minutes: 10
        env:
          APP_NAME: ${{ steps.context.outputs.api_container_app_name }}
          ARTIFACT_DEPLOYED: ${{ needs.changes.outputs.app }}
          REGISTRY: ${{ steps.context.outputs.container_registry_endpoint }}
          RESOURCE_GROUP: ${{ steps.context.outputs.resource_group_name }}
          READY_URL: ${{ steps.context.outputs.api_url }}/ready
        run: |
          set -euo pipefail

          EXPECTED_IMAGE=""
          if [[ "$ARTIFACT_DEPLOYED" == "true" ]]; then
            EXPECTED_IMAGE="$REGISTRY/api:$GITHUB_SHA"
          fi

          REVISION=""
          if [[ -n "$EXPECTED_IMAGE" ]]; then
            echo "Looking for revision running image: $EXPECTED_IMAGE"
            for i in {1..12}; do
              REVISION=$(az containerapp revision list \
                --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                --query "[?properties.template.containers[0].image=='$EXPECTED_IMAGE'] | [0].name" \
                -o tsv 2>/dev/null || true)
              if [[ -n "$REVISION" && "$REVISION" != "None" ]]; then
                break
              fi
              sleep 5
            done
          else
            REVISION=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestRevisionName \
              --output tsv)
          fi

          if [[ -z "$REVISION" || "$REVISION" == "None" ]]; then
            echo "::error::No expected Container App revision was found." >&2
            exit 1
          fi

          for i in {1..36}; do
            STATE=$(az containerapp revision show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION" \
              --query "{health:properties.healthState, running:properties.runningState, traffic:properties.trafficWeight}" \
              -o json 2>/dev/null || echo '{}')
            HEALTH=$(echo "$STATE" | jq -r '.health // "Unknown"')
            RUNNING=$(echo "$STATE" | jq -r '.running // "Unknown"')
            TRAFFIC=$(echo "$STATE" | jq -r '.traffic // 0')
            echo "Attempt $i: revision=$REVISION health=$HEALTH running=$RUNNING traffic=$TRAFFIC"

            if [[ "$RUNNING" =~ ^(ActivationFailed|Failed)$ ]]; then
              az containerapp logs show \
                --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION" \
                --tail 100 --format text 2>&1 || true
              exit 1
            fi
            if [[ "$HEALTH" == "Healthy" && "$TRAFFIC" -gt 0 ]]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" "$READY_URL" || true)
              if [[ "$code" == "200" ]]; then
                exit 0
              fi
            fi
            sleep 10
          done
          az containerapp logs show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION" \
            --tail 100 --format text 2>&1 || true
          exit 1

      - name: Smoke test verification submit path
        timeout-minutes: 3
        env:
          SMOKE_SCOPE: ${{ steps.context.outputs.smoke_auth_scope }}
          SMOKE_URL: ${{ steps.context.outputs.api_url }}/internal/smoke/verification
        run: |
          set -euo pipefail
          access_token=$(az account get-access-token \
            --scope "$SMOKE_SCOPE" \
            --query accessToken \
            --output tsv)
          echo "::add-mask::$access_token"

          code=000
          for i in {1..6}; do
            if ! code=$(curl --silent --output /tmp/entra_smoke_body.txt \
              --write-out "%{http_code}" \
              --request POST "$SMOKE_URL" \
              --header "Authorization: Bearer $access_token"); then
              code=000
            fi
            echo "Attempt $i: HTTP $code"
            if [[ "$code" == "200" ]]; then
              cat /tmp/entra_smoke_body.txt || true
              exit 0
            fi
            sleep 10
          done

          cat /tmp/entra_smoke_body.txt || true
          exit 1
