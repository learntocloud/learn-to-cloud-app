uuid: 623a87ae-156f-42da-a83c-09241d523e00
slug: devops-implementation
submission_type: devops_analysis
name: Complete the DevOps Capstone
description: >-
  We'll check the latest run of `.github/workflows/ci.yml` on your fork's
  current `main` commit. The run must succeed with exactly one successful
  job named `test`, `build`, and `deploy`. Use those exact job IDs and display
  names, without matrix suffixes. These jobs should test the app, build and
  publish its container image, and deploy it to Kubernetes and confirm rollout.
  Verification uses run and job results only, not source files, commands, logs,
  or AI review. It does not prove what each job actually does. If you rerun
  a workflow, choose Re-run all jobs so the latest attempt contains all three.
type_config:
  required_repo: learntocloud/journal-starter
