# yaml-language-server: $schema=../../schemas/topic.schema.json
uuid: 7ca1401a-0e78-4fcb-8665-aeba544555d1
slug: cloud-ai-services
name: Operating Cloud AI Services
description: Build on the live LLM endpoint from Phase 3. You'll map it to your chosen cloud platform, compare models with the Journal API workload, configure safety controls, and add the operational settings needed for a reliable deployment.
learning_objectives:
- uuid: 94fb0b7b-880c-4e19-a592-cbc30fdd993f
  text: Map the Phase 3 Responses API workflow to the model and endpoint options on your cloud platform.
  order: 1
- uuid: c3eece64-dce6-4fcd-978c-bb7c3d0e0a79
  text: Evaluate safety and guardrail features for responsible AI application design.
  order: 2
- uuid: abde4fdd-af46-4e6a-afc9-a805cb0d10dc
  text: Evaluate model quality, latency, cost, reliability, and safety for the Journal API.
  order: 3
learning_steps:
- uuid: 0244b5d1-5de4-4efb-92e6-b0a8e7478121
  order: 1
  action: 'Read:'
  description: Review how your chosen cloud platform exposes models, endpoints, authentication, quotas, and pricing. Keep using the live Phase 3 endpoint unless migration supports your learning goal.
  options:
  - provider: azure
    title: Microsoft Foundry
    url: https://learn.microsoft.com/azure/foundry/what-is-foundry
    description: Microsoft's unified platform for building, deploying, and managing AI models
  - provider: aws
    title: AWS Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/what-is-bedrock.html
    description: Amazon's fully managed service for building generative AI applications
  - provider: gcp
    title: GCP Vertex AI
    url: https://docs.cloud.google.com/vertex-ai/docs/start/introduction-unified-platform
    description: Google's unified AI platform for building and deploying ML models
  title: Map your live endpoint to the cloud platform
  slug: phase4-topic8-read-map-live-endpoint
- uuid: 393a8393-f60d-4fe2-b376-dcf4adc4e77d
  order: 2
  action: 'Practice:'
  description: Use the Journal API sentiment-analysis prompt set against at least two suitable models. Record response quality, latency, input/output cost, quota limits, and whether each model supports your required structured response.
  options:
  - provider: azure
    title: Microsoft Foundry Models
    url: https://learn.microsoft.com/azure/foundry/concepts/foundry-models-overview
    description: Compare models and deployment options in the current Foundry portal.
  - provider: aws
    title: Amazon Bedrock supported models
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/models-supported.html
    description: Compare supported foundation models and inference features.
  - provider: gcp
    title: Vertex AI generative AI models
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models
    description: Compare models available through Vertex AI.
  title: Compare models with the Journal API workload
  slug: phase4-topic8-practice-compare-models-journal-api
- uuid: f09e2ffb-b85f-46b3-a705-96846f73d321
  order: 3
  action: 'Practice:'
  description: Configure your provider's content filtering or guardrails for the Journal API. Test an allowed request and a request that should be blocked, then document how blocked responses surface to the application.
  options:
  - provider: azure
    title: Microsoft Foundry Guardrails
    url: https://learn.microsoft.com/azure/foundry/guardrails/guardrails-overview
    description: Configure content filtering and safety guardrails in Microsoft Foundry
  - provider: aws
    title: AWS Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails.html
    description: Set up guardrails for responsible AI use in Amazon Bedrock
  - provider: gcp
    title: GCP Safety Overview
    url: https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/safety-overview
    description: Understand safety features and content filtering in Vertex AI
  title: Configure and test safety controls
  slug: phase4-topic8-practice-configure-test-safety-controls
- uuid: d70e1caf-d6be-4c1b-9d9f-fc1e6f544b67
  order: 4
  action: 'Practice:'
  title: Define the production AI configuration
  description: Select the model used by the capstone and document its endpoint type, authentication method, rate and token limits, timeout, retry policy, logging, safety controls, and expected cost. Keep the endpoint available for the capstone; consumption-based and provisioned deployments have different cleanup and billing behavior.
  slug: phase4-topic8-practice-define-production-ai-configuration
