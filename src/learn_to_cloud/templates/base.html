<!DOCTYPE html>
<html lang="en" class="h-full overflow-y-scroll" x-data="{ darkMode: localStorage.getItem('theme') === 'dark' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Learn to Cloud{% endblock %}</title>
    <meta name="description" content="{% block description %}A guided path to learn cloud computing{% endblock %}">
    <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <link rel="stylesheet" href="{{ static_url('css/styles.css') }}">

    {% if frontend_telemetry %}
    <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js" crossorigin="anonymous"></script>
    <script>
        if (window.Microsoft && window.Microsoft.ApplicationInsights) {
            window.appInsights = new Microsoft.ApplicationInsights.ApplicationInsights({
                config: {
                    connectionString: {{ frontend_telemetry.connection_string | tojson }},
                    cookieCfg: { enabled: false },
                    isStorageUseDisabled: true,
                    enableSessionStorageBuffer: false,
                    samplingPercentage: {{ frontend_telemetry.sampling_percentage | tojson }},
                    enableUnhandledPromiseRejectionTracking: true
                }
            });
        }
    </script>
    <script src="{{ static_url('js/frontend-telemetry.js') }}"></script>
    {% endif %}

    <!-- Apply dark class synchronously to prevent FOUC -->
    <script>
        document.documentElement.classList.toggle(
            'dark',
            localStorage.getItem('theme') === 'dark'
        );
        // Theme toggle — vanilla JS with event delegation so it survives
        // HTMX body swaps and works even if Alpine fails to load.
        document.addEventListener('click', function(e) {
            var btn = e.target.closest('#theme-toggle');
            if (!btn) return;
            var isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            // Sync Alpine reactive state if available
            if (document.documentElement._x_dataStack) {
                document.documentElement._x_dataStack[0].darkMode = isDark;
            }
        });
    </script>

    <!-- Hide Alpine.js elements until initialized -->
    <style>[x-cloak] { display: none !important; }</style>

    <script src="{{ static_url('js/htmx.min.js') }}"></script>

    <script defer src="{{ static_url('js/alpine-collapse.min.js') }}"></script>
    <script defer src="{{ static_url('js/copy-to-clipboard.js') }}"></script>
    <script defer src="{{ static_url('js/verification.js') }}"></script>
    <script defer src="{{ static_url('js/alpine.min.js') }}"></script>

    <script>
        // Redirect to login on 401 responses
        document.addEventListener('htmx:responseError', function(event) {
            if (event.detail.xhr.status === 401) {
                window.location.href = '/auth/login';
            }
        });
    </script>

    <script>
        // Fix Alpine.js + HTMX boost interaction.
        // HTMX's settle phase (20ms after swap) copies old attributes onto
        // new DOM, which conflicts with Alpine's MutationObserver processing.
        // Deferring mutations prevents Alpine from seeing the intermediate
        // attribute state. See: https://github.com/alpinejs/alpine/discussions/4485
        document.addEventListener('htmx:beforeSwap', function(event) {
            if (event.detail.boosted && typeof Alpine !== 'undefined') {
                Alpine.deferMutations();
            }
        });
        document.addEventListener('htmx:afterSettle', function(event) {
            if (event.detail.boosted && typeof Alpine !== 'undefined') {
                Alpine.flushAndStopDeferringMutations();
            }
        });
    </script>

    <script>
        // Prefill only route context; reporters must describe the problem themselves.
        (function() {
            function decorateIssueLink(anchor) {
                if (!anchor || anchor.dataset.issueDecorated === '1') return;
                var baseUrl = anchor.getAttribute('href') || '';
                if (!baseUrl.startsWith('https://github.com/learntocloud/learn-to-cloud-app/issues/new')) return;

                var url = new URL(baseUrl);
                if (url.pathname !== '/learntocloud/learn-to-cloud-app/issues/new') return;
                var template = url.searchParams.get('template');
                if (template !== 'content_problem.yml' && template !== 'app_problem.yml') return;
                var page = new URL(window.location.href);
                var context = anchor.dataset.issueContext || url.searchParams.get('location') || page.pathname;
                var phase = page.pathname.match(/(?:^|\/)phase\/(\d+)(?:\/|$)/);
                if (phase && !context.includes('phase=')) context = 'phase=' + phase[1] + ', ' + context;

                url.searchParams.set('title', anchor.dataset.issueTitle || 'Issue with the app');
                url.searchParams.set('location', context);
                url.searchParams.set('page-url', page.origin + page.pathname);
                url.searchParams.set('diagnostics', [
                    'Reported at: ' + new Date().toISOString(),
                    'Browser: ' + navigator.userAgent
                ].join('\n'));
                url.searchParams.delete('body');
                url.searchParams.delete('labels');

                anchor.href = url.toString();
                anchor.dataset.issueDecorated = '1';
            }

            function handle(event) {
                var anchor = event.target && event.target.closest
                    ? event.target.closest('a[data-report-issue]')
                    : null;
                if (anchor) decorateIssueLink(anchor);
            }

            // Use early events so the updated href is used for navigation/new tabs.
            document.addEventListener('pointerdown', handle, true);
            document.addEventListener('click', handle, true);
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') handle(event);
            }, true);
        })();
    </script>



    {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 text-lg" hx-boost="true">
    {% include "partials/navbar.html" %}

    <aside
        aria-label="Phase 0 feedback"
        x-data="{ visible: localStorage.getItem('phase0-feedback-dismissed') !== 'true' }"
        x-show="visible"
        class="border-b border-gray-200 bg-blue-100 text-blue-800 dark:border-gray-700 dark:bg-gray-800 dark:text-blue-300"
    >
        <div class="mx-auto flex max-w-content items-center justify-between gap-3 px-4 sm:px-6 lg:px-8">
            <p class="py-3 text-sm leading-6">
                What would help you make progress in Phase 0?
                <a href="https://github.com/learntocloud/learn-to-cloud-app/discussions/1001" target="_blank" rel="noopener noreferrer" hx-boost="false" class="font-semibold underline underline-offset-4 hover:no-underline focus-visible:rounded-md focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700 dark:focus-visible:outline-blue-300">Share feedback on GitHub<span class="sr-only"> (opens in a new tab)</span></a>
            </p>
            <button type="button" aria-label="Dismiss feedback banner" x-cloak @click="visible = false; localStorage.setItem('phase0-feedback-dismissed', 'true')" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-md hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700 dark:hover:bg-gray-700 dark:focus-visible:outline-blue-300">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m6 6 12 12M18 6 6 18"/>
                </svg>
            </button>
        </div>
    </aside>

    <main
        class="flex-1 w-full mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-10 sm:py-12"
    >
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
</body>
</html>
