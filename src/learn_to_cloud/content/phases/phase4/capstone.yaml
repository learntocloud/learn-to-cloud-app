uuid: ddd726e7-818e-4672-b33a-579718b1a8f3
slug: capstone
name: 'Capstone: Secure Cloud Deployment'
description: Deploy your completed Journal API on AWS, Azure, or Google Cloud. The Journal Starter README covers the application; this page lists only the cloud deployment constraints, verification contract, and evidence required to finish Phase 4.
learning_steps:
- uuid: 4c1da717-a539-446a-81bc-deb7aec0e05a
  order: 1
  action: 'Build:'
  title: Meet the deployment constraints
  description: Choose the services and deployment tools yourself. A two-tier application and database architecture is sufficient; no frontend is required.
  checklist:
  - Expose the API over public HTTPS with a trusted certificate.
  - Keep PostgreSQL on a separate private tier that accepts connections from the application tier but not the public internet.
  - Keep management ports private, require authenticated administrative access, and keep credentials out of source control and logs.
  - Keep the service running after your administrative session ends and preserve journal data across application restarts.
  - Preserve the completed Journal API behavior, including CRUD operations and analysis through a live AI service.
  - Estimate costs and configure budget alerts before provisioning.
  tips:
  - type: warning
    text: The Journal API has no user authentication or data isolation. Use only test data and do not store personal or sensitive journal content.
  done_when: You can demonstrate each deployment constraint on the running system.
  slug: phase4-topic9-practice-deploy-api-service
- uuid: a6ab032c-fe77-4d31-987f-564f6248ede6
  order: 2
  action: 'Practice:'
  title: Submit your deployment
  description: Submit your public HTTPS base URL. The verifier makes these requests without authentication headers and requires direct JSON responses without redirects.
  checklist:
  - "`POST /entries` accepts `work`, `struggle`, and `intention` and returns HTTP 200 or 201 with a non-empty string `id`, either at the top level or inside an `entry` object."
  - "`POST /entries/{id}/analyze` returns HTTP 200 within 30 seconds with the matching `entry_id`, a `sentiment` of `positive`, `negative`, or `neutral`, a non-empty `summary`, and a non-empty `topics` list of non-empty strings."
  tips:
  - type: tip
    text: Automated verification checks entry creation and the analysis response contract, not your architecture, database isolation, other CRUD operations, or whether a real model produced the response. You are responsible for demonstrating the remaining requirements.
  - type: warning
    text: Each request runs once without automatic retries. Analysis through your live model may incur a charge. The created entry stays in your journal; the verifier does not list or delete entries.
  done_when: The verifier reports that entry creation and live AI analysis passed.
  slug: phase4-topic9-practice-verify-submit-deployment
- uuid: 8560edaf-a754-485a-93bc-42b20d6b18f6
  order: 3
  action: 'Reflect:'
  title: Record deployment evidence and clean up
  description: Update your Journal Starter README with only the information created by this deployment.
  checklist:
  - Add an architecture diagram showing public, private, and administrative traffic paths.
  - Record the services you selected, expected cost, access controls, AI model and safety controls, and evidence that each deployment constraint passed.
  - Identify one limitation you would address before using the system in production.
  - Delete resources you do not need for Phase 5 and check your billing dashboard for unexpected charges.
  done_when: Your README contains the deployment evidence, and your cloud account contains only resources you intentionally retained for Phase 5.
  slug: phase4-topic9-reflect-document-clean-up
