uuid: 2f9a6c38-28f5-474b-9578-a71734f112b2
slug: security-scanning
submission_type: security_scanning
name: Secure Your Journal API
description: >-
  We'll check that the latest CodeQL run for your fork's `main` branch passed
  on your latest commit, then probe the live API your deploy job records as
  the `production` environment for that commit: plain `http://` must redirect
  to HTTPS or not serve your API, and HTTPS responses must send a
  `Strict-Transport-Security` header. Verify before you clean up your cloud
  resources.
type_config:
  required_repo: learntocloud/journal-starter
