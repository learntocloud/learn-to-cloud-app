[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["function_app", "verification_agents"]

[project]
name = "learn-to-cloud-verification-functions"
version = "0.1.0"
description = "Durable Functions host for Learn to Cloud verification jobs"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-core>=1.16.0",
    "azure-functions>=2.2.0",
    "azure-functions-durable>=1.7.0",
    "learn-to-cloud-shared",
    "agent-framework-foundry>=1.3.0",
    "agent-framework-openai>=1.14.1",
    "azure-identity>=1.25.3",
    "openai>=2.54.0,<3",
    "opentelemetry-api>=1.43.0,<1.44.0",
    "pydantic>=2.13.5,<3",
    # Core Tools 4.14 bundles protobuf 5.x and cannot load protobuf 7 modules.
    "protobuf>=5,<7",
    "sqlalchemy>=2.0.52,<3",
]

[tool.uv.sources]
learn-to-cloud-shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff==0.16.5",
    "ty==0.0.77",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-v"]
