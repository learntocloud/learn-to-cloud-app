[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Only the compiled curriculum ships; authored YAML and schemas stay
# source-only (see curriculum/yaml_loader.py).
wheel-exclude = [
    "content/phases",
    "content/schemas",
    "content/curriculum.meta.yaml",
]

[tool.alembic]
script_location = "learn_to_cloud:migrations"

[project]
name = "learn-to-cloud"
version = "0.1.0"
description = "Learn to Cloud API - FastAPI backend for learning cloud computing"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agent-framework-core>=1.16.0",
    "agent-framework-foundry>=1.3.0",
    "agent-framework-openai>=1.14.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.7.0",
    # The aio extra installs aiohttp, which azure.identity.aio needs at runtime.
    "azure-core[aio]>=1.41.0",
    "azure-identity>=1.25.3",
    "azure-monitor-opentelemetry>=1.8.10",
    "fastapi>=0.141.1,<1",
    "httpx2>=2.12.0",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    # azure-monitor-opentelemetry 1.8.10 requires the OpenTelemetry 1.44 line.
    "opentelemetry-api>=1.44.0,<1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<1.45.0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-logging==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-sdk>=1.44.0,<1.45.0",
    "openai>=3.20.0,<4",
    "pydantic>=2.13.3,<3",
    "pydantic-settings>=2.14.2",
    "python-json-logger>=4.1.0",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.49,<3",
    "starlette>=1.3.1",
    "tenacity>=8.2.0",
    "uvicorn>=0.52.1",
    # Uvicorn picks these up automatically for faster event loop and HTTP parsing.
    "httptools>=0.8.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
]

[project.scripts]
learn-to-cloud-migrate = "learn_to_cloud.migrations:main"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "prek>=0.4.12",
    "pytest>=9.0.3",
    "pytest-alembic>=0.12.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff==0.16.9",
    "squawk-cli>=2.53.0",
    "ty==0.0.84",
    # Required by uvicorn --reload-include during local development.
    "watchfiles>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "--durations=10", "-ra", "-v"]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (database required)",
    "smoke: minimal smoke test subset",
]

[tool.coverage.run]
source = ["src/learn_to_cloud"]
omit = [
    "tests/*",
    "src/learn_to_cloud/migrations/env.py",
    "src/learn_to_cloud/migrations/versions/*",
    "scripts/*",
    "__pycache__/*",
    ".venv/*",
    "*.pyc",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
fail_under = 40

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC0415", "ARG001", "RUF029"]
preview = true
explicit-preview-rules = true

[tool.ty.environment]
# Use the current Python interpreter to resolve third-party imports
python-platform = "linux"

[tool.poe.tasks.static]
help = "Run all static checks (lint, format, type-check, migration SQL, file hygiene) via prek"
cmd = "prek run --all-files --show-diff-on-failure"

[tool.poe.tasks.test]
help = "Run the API test suite with its coverage gate"
cmd = "pytest --cov=learn_to_cloud --cov-report=term-missing"

[tool.poe.tasks.package-smoke]
help = "Build and validate the installed API runtime package"
shell = """
set -eu
tmpdir=$(mktemp -d)
trap 'rm -rf "$tmpdir"' EXIT
uv build --wheel --out-dir "$tmpdir"
wheel=$(find "$tmpdir" -maxdepth 1 -name '*.whl' -print -quit)
uv venv "$tmpdir/venv"
uv pip install --python "$tmpdir/venv/bin/python" "$wheel"
"$tmpdir/venv/bin/python" -m learn_to_cloud.runtime_package_check
"""

[tool.poe.tasks.check]
help = "Run the full quality gate: static checks, package smoke, then tests"
sequence = ["static", "package-smoke", "test"]
