uuid: ddd726e7-818e-4672-b33a-579718b1a8f3
slug: capstone
name: 'Capstone: Secure Cloud Deployment'
description: Deploy your Phase 3 Journal API on your chosen cloud. You own the architecture, service choices, and deployment approach. Use the earlier topics as references, not a deployment recipe. Researching what you do not yet know is part of this project.
short_description: Deploy the Journal API over HTTPS with private database connectivity, secure administration, and live cloud AI analysis.
learning_objectives:
- uuid: a8283b86-24bb-4e2e-8a20-7679cd19741a
  text: Choose and justify a cloud architecture with separate application and database tiers.
  order: 1
- uuid: 6654c03c-ccbf-4983-9147-3130f07ee90e
  text: Deploy and operate the Journal API without public database or management access.
  order: 2
- uuid: f3263740-4646-4160-9cb7-e5d07445ce2c
  text: Integrate the live model endpoint selected for the Journal API.
  order: 3
- uuid: 0f9954fd-42d1-4a8a-99e1-9ee7b8f1a8d4
  text: Demonstrate working API behavior, explain security and cost tradeoffs, and clean up unused resources.
  order: 4
learning_steps:
- uuid: 4c1da717-a539-446a-81bc-deb7aec0e05a
  order: 1
  action: 'Build:'
  title: Deploy the Journal API
  description: Choose the cloud services and tools yourself. A two-tier application and database architecture is sufficient; a frontend or third tier is not required. Meet these requirements without following a prescribed implementation.
  checklist:
  - Expose the API over public HTTPS with a trusted certificate.
  - Separate the application and PostgreSQL tiers, with private database connectivity and no public database access.
  - Keep administrative access private and authenticated, and credentials out of source control and logs.
  - Preserve all Journal API CRUD operations and data across application restarts, and keep the service running after your administrative session ends.
  - Connect the analysis endpoint to a live AI service, not a mock response.
  - Estimate costs and configure budget alerts before provisioning.
  done_when: You have demonstrated the API behavior and access controls on your deployed system.
  slug: phase4-topic9-practice-deploy-api-service
- uuid: a6ab032c-fe77-4d31-987f-564f6248ede6
  order: 2
  action: 'Practice:'
  title: Submit your deployment
  description: Submit your public HTTPS base URL. The verifier makes these requests without authentication headers and requires direct JSON responses without redirects.
  checklist:
  - "`POST /entries` accepts `work`, `struggle`, and `intention` and returns HTTP 200 or 201 with a non-empty string `id`, either at the top level or inside an `entry` object."
  - "`POST /entries/{id}/analyze` returns HTTP 200 within 30 seconds with the matching `entry_id`, a `sentiment` of `positive`, `negative`, or `neutral`, a non-empty `summary`, and a non-empty `topics` list of non-empty strings."
  tips:
  - type: tip
    text: Automated verification checks entry creation and the analysis response contract, not your architecture, database isolation, other CRUD operations, or whether a real model produced the response. You are responsible for demonstrating the remaining requirements.
  - type: warning
    text: Each request runs once without automatic retries. Analysis through your live model may incur a charge. The created entry stays in your journal; the verifier does not list or delete entries.
  done_when: The verifier reports that entry creation and live AI analysis passed.
  slug: phase4-topic9-practice-verify-submit-deployment
- uuid: 8560edaf-a754-485a-93bc-42b20d6b18f6
  order: 3
  action: 'Reflect:'
  title: Document decisions and clean up
  description: Add an architecture diagram and concise notes to your Journal Starter README. Explain your service choices, public and private traffic paths, access controls, AI model and safety choices, expected costs, and how you demonstrated the requirements. Identify one limitation you would address before production. Delete resources you do not need for Phase 5 and review your billing dashboard for unexpected charges.
  done_when: Your repository documents the verified deployment and your cloud account contains only resources you intentionally retained for Phase 5.
  slug: phase4-topic9-reflect-document-clean-up
