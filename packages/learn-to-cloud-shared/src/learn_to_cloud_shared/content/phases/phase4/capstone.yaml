uuid: ddd726e7-818e-4672-b33a-579718b1a8f3
slug: capstone
name: 'Capstone: Secure Cloud Deployment'
description: Deploy the Journal API from Phase 3 as a secure foundational cloud workload. You'll combine segmented networking, private PostgreSQL connectivity, HTTPS, identity-aware administration, cost controls, and the live AI endpoint you evaluated in this phase. The goal is a defensible working deployment, not a claim of full production readiness.
short_description: Deploy the Journal API over HTTPS with private database connectivity, secure administration, and live cloud AI analysis.
learning_objectives:
- uuid: a8283b86-24bb-4e2e-8a20-7679cd19741a
  text: Design a segmented cloud architecture for public API and private database traffic.
  order: 1
- uuid: 6654c03c-ccbf-4983-9147-3130f07ee90e
  text: Deploy and operate the Journal API without public database or management access.
  order: 2
- uuid: f3263740-4646-4160-9cb7-e5d07445ce2c
  text: Integrate the live model endpoint selected for the Journal API.
  order: 3
- uuid: 0f9954fd-42d1-4a8a-99e1-9ee7b8f1a8d4
  text: Validate HTTPS, CRUD behavior, AI analysis, private connectivity, and cleanup.
  order: 4
learning_steps:
- uuid: 0bb54815-026c-4012-96c6-c4511e8870c3
  order: 1
  action: 'Explore:'
  title: Draw the deployment and traffic paths
  description: Draw the network before provisioning resources. Reuse the decisions and diagnostic evidence from the networking, database, and AI topics.
  checklist:
  - A virtual network with non-overlapping application and private database subnets
  - Public HTTPS traffic terminating at a reverse proxy or managed ingress
  - The API process listening only behind that HTTPS entry point
  - Private API-to-database traffic on port 5432
  - No public IP or public inbound rule for the database
  - No public SSH or RDP rule for either tier
  - Bastion, Session Manager, or IAP for administrative access
  - The outbound path required for package installation and the live AI endpoint
  done_when: Your diagram shows each allowed traffic path, its port, and the control that blocks unintended access.
  slug: phase4-topic9-design-deployment-traffic-paths
- uuid: c35ea082-b623-475d-94ff-32a71fa9e519
  order: 2
  action: 'Practice:'
  title: Provision the network, compute, and private database
  description: Create the segmented network and compute resources from your design. Reuse the private PostgreSQL tier from the database topic if it is still running; otherwise reproduce it. Use cloud-init, provider run-command tooling, or identity-aware sessions for setup instead of temporarily exposing management ports.
  checklist:
  - Create the application and private database subnets
  - Apply least-privilege routes and firewall or security-group rules
  - Deploy the API compute in the application subnet
  - Deploy PostgreSQL without a public IP, or use managed PostgreSQL with private connectivity
  - Create the `career_journal` database and least-privilege application role
  - Run `database_setup.sql`
  - Prove the API compute can reach PostgreSQL and the public internet cannot
  done_when: The database is reachable from the API workload over a private path and is unreachable from your local machine over the public internet.
  slug: phase4-topic9-practice-provision-foundational-infrastructure
- uuid: 4c1da717-a539-446a-81bc-deb7aec0e05a
  order: 3
  action: 'Practice:'
  title: Deploy the Journal API as a managed service process
  description: Clone your fork onto the API compute, install dependencies, configure the private database connection, and run the API with a service manager such as systemd. Keep runtime settings outside the repository and restrict access to the service account.
  checklist:
  - Install Python 3.11 or newer and `uv`
  - Configure `DATABASE_URL` with the database's private address
  - Store runtime settings in a protected environment file or provider secrets integration
  - Run Uvicorn through systemd or an equivalent service manager without `--reload`
  - Bind Uvicorn to localhost or an internal interface rather than exposing port 8000 publicly
  - Verify the service restarts and survives an administrative session ending
  done_when: All Journal API CRUD operations work from the API host and the service is supervised by the operating system.
  slug: phase4-topic9-practice-deploy-api-service
- uuid: 27462a4a-7f2d-47f2-b910-2eb9d030deba
  order: 4
  action: 'Practice:'
  title: Expose HTTPS and verify secure administration
  description: Configure DNS, a trusted TLS certificate, and a reverse proxy or managed ingress that forwards to the private application listener. Administer the hosts only through the identity-aware access path configured earlier.
  checklist:
  - Point a DNS name at the public HTTPS entry point
  - Terminate TLS with a trusted certificate
  - Forward HTTPS requests to the internal Journal API listener
  - Allow public inbound traffic only on required web ports
  - Confirm SSH and RDP are not publicly reachable
  - Locate the audit event for an administrative session
  done_when: "`curl https://your-domain/entries` returns a direct 200 response with valid JSON and a trusted certificate, while public management ports remain blocked."
  slug: phase4-topic9-practice-expose-https-secure-administration
- uuid: 023ae8e4-f00e-4c6b-af08-93055c275aeb
  order: 5
  action: 'Practice:'
  title: Configure and test the live AI endpoint
  description: Configure the API with the model endpoint selected in Operating Cloud AI Services. Use the Responses API environment variables from Phase 3 when the provider is compatible; otherwise use the provider adapter you implemented. Do not commit credentials.
  checklist:
  - Configure the endpoint, model or deployment name, and authentication
  - Apply the timeout, retry, rate-limit, and safety decisions you documented
  - Restart the API service and inspect its logs for configuration errors
  - Create a journal entry and call `POST /entries/{id}/analyze`
  - Confirm the response includes `entry_id`, `sentiment`, `summary`, and `topics`
  done_when: The deployed HTTPS API returns a valid live AI analysis without exposing credentials in source control or logs.
  slug: phase4-topic9-practice-configure-test-live-ai
- uuid: a6ab032c-fe77-4d31-987f-564f6248ede6
  order: 6
  action: 'Practice:'
  title: Verify and submit the deployment
  description: Submit the HTTPS base URL. The verifier creates a unique challenge entry, confirms it appears in `GET /entries`, calls its live AI analysis endpoint, validates the response schema, and deletes the challenge entry.
  tips:
  - type: tip
    text: The API must return direct JSON responses without HTTP redirects. AI wording is nondeterministic, so verification checks the response schema rather than exact text.
  - type: warning
    text: Verification makes one billable model request and allows additional time for that request to complete.
  done_when: The verifier confirms API ownership and reports that live AI analysis passed.
  slug: phase4-topic9-practice-verify-submit-deployment
- uuid: 8560edaf-a754-485a-93bc-42b20d6b18f6
  order: 7
  action: 'Reflect:'
  title: Document decisions and clean up
  description: Add a concise architecture diagram and deployment notes to your Journal Starter README. Explain the network boundaries, administration path, database controls, AI endpoint, cost estimate, and one limitation you would address before production. After verification, delete every resource you do not need for Phase 5.
  checklist:
  - Document what you actually deployed rather than an idealized architecture
  - Record the public and private traffic paths and their controls
  - Explain the model choice, safety settings, and expected cost
  - Note at least one remaining production concern such as backup, high availability, secrets rotation, or disaster recovery
  - Delete compute, disks, IPs, networking services, database resources, and unused AI deployments
  - Confirm the billing dashboard shows no unexpected active resources
  done_when: Your repository documents the verified deployment and your cloud account contains only resources you intentionally retained for Phase 5.
  slug: phase4-topic9-reflect-document-clean-up
