# yaml-language-server: $schema=../../schemas/topic.schema.json
uuid: 822291f9-041c-4846-8db0-90d58ca414f0
slug: cloud-networking
name: Cloud Networking & Secure Access
description: Design and validate a segmented cloud network, then manage its virtual machines through identity-aware, session-based access instead of public SSH. The focus is proving how routing and security controls allow required traffic and deny everything else.
learning_objectives:
- uuid: ae5453c4-5f75-41e8-b2d5-230506f8ea07
  text: Design VPC/VNet address spaces and public and private subnet boundaries.
  order: 1
- uuid: 8d52131a-53da-48a7-8c5a-c85d5b370229
  text: Configure routes, gateways, NAT, and firewall rules for least-exposed connectivity.
  order: 2
- uuid: a17d5793-3363-421b-bd5d-8cbb21d7e650
  text: Use provider-native, identity-aware access without exposing management ports publicly.
  order: 3
- uuid: 5ebda0e3-9bf3-4df9-aafd-acf011419a95
  text: Diagnose and prove allowed and denied network paths.
  order: 4
learning_steps:
- uuid: 53e1643d-7acd-4a23-b096-aa774adf4d82
  order: 1
  action: 'Read:'
  title: Design the virtual network and subnets
  description: Learn how your provider represents virtual networks, CIDR ranges, regional boundaries, and subnets. Design one application subnet and one private database subnet with non-overlapping address ranges.
  options:
  - provider: azure
    title: Azure VNet planning and design
    url: https://learn.microsoft.com/azure/virtual-network/virtual-network-vnet-plan-design-arm
    description: Plan Azure address spaces, subnets, and service connectivity.
  - provider: aws
    title: Amazon VPC and CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html
    description: Plan an Amazon VPC, IPv4 CIDR ranges, and subnets.
  - provider: gcp
    title: Google Cloud VPC networks and subnets
    url: https://docs.cloud.google.com/vpc/docs/vpc
    description: Plan Google Cloud VPC networks, regions, and subnet ranges.
  slug: phase4-topic3-read-design-network-subnets
- uuid: 26bacf49-3e5e-421d-90ec-78f6391ab57e
  order: 2
  action: 'Read:'
  title: Plan routes, internet access, and firewall policy
  description: Understand route tables, internet access, NAT for private workloads, and stateful firewall rules. Permit only the traffic required by the Journal API architecture and avoid public management ports.
  options:
  - provider: azure
    title: Azure virtual network traffic controls
    url: https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview
    description: Understand NSGs, service tags, routes, and outbound connectivity.
  - provider: aws
    title: Amazon VPC security groups and route tables
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
    description: Understand security groups, route tables, internet gateways, and NAT.
  - provider: gcp
    title: Google Cloud VPC firewall rules
    url: https://docs.cloud.google.com/firewall/docs/firewalls
    description: Understand firewall policy, routes, external IPs, and Cloud NAT.
  slug: phase4-topic3-read-plan-routing-firewall
- uuid: aff9e130-cccb-4dc4-afa6-17361f6f4f11
  order: 3
  action: 'Read:'
  title: Keep the database on a private path
  description: The database should accept traffic only from the API workload over private addressing. Learn the private endpoint, private IP, or private subnet pattern for your provider before deploying it.
  options:
  - provider: azure
    title: Azure Private Endpoint overview
    url: https://learn.microsoft.com/azure/private-link/private-endpoint-overview
    description: Provide private connectivity to supported Azure services.
  - provider: aws
    title: Amazon RDS in a VPC
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html
    description: Place RDS in private subnets and restrict access with security groups.
  - provider: gcp
    title: Cloud SQL private IP
    url: https://docs.cloud.google.com/sql/docs/postgres/private-ip
    description: Connect to Cloud SQL through private services access.
  slug: phase4-topic3-read-keep-database-private
- uuid: 378183a3-37a3-4a99-aee6-586060c2d27b
  order: 4
  action: 'Read:'
  title: Learn provider-native network diagnostics
  description: Use path analysis to explain why a flow is allowed or denied across routes, gateways, and firewall policy.
  options:
  - provider: azure
    title: Azure Network Watcher IP flow verify
    url: https://learn.microsoft.com/azure/network-watcher/ip-flow-verify-overview
    description: Validate effective NSG decisions for a proposed traffic flow.
  - provider: aws
    title: AWS Reachability Analyzer
    url: https://docs.aws.amazon.com/vpc/latest/reachability/what-is-reachability-analyzer.html
    description: Analyze network paths across VPC components.
  - provider: gcp
    title: Google Cloud Connectivity Tests
    url: https://docs.cloud.google.com/network-intelligence-center/docs/connectivity-tests/concepts/overview
    description: Analyze reachability across routes and firewall rules.
  slug: phase4-topic3-read-network-diagnostics
- uuid: 8942ce4b-d77d-4fde-9940-618817454bea
  order: 5
  action: 'Practice:'
  title: Inspect network resources through the CLI
  description: List virtual networks, subnets, routes, gateways, and firewall rules with your cloud CLI. Filter the output so you can explain each resource's purpose before changing it.
  options:
  - provider: azure
    title: Azure CLI VNet commands
    url: https://learn.microsoft.com/cli/azure/network/vnet
    description: Inspect VNets, subnets, peerings, and related resources.
  - provider: aws
    title: AWS CLI describe-vpcs
    url: https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-vpcs.html
    description: Inspect VPCs and related EC2 networking resources.
  - provider: gcp
    title: gcloud compute networks
    url: https://cloud.google.com/sdk/gcloud/reference/compute/networks
    description: Inspect VPC networks, subnets, routes, and firewall rules.
  slug: phase4-topic3-practice-inspect-network-cli
- uuid: 0f26efe0-8522-4ab1-b490-4983a0794eb4
  order: 6
  action: 'Practice:'
  title: Deploy the segmented network
  description: Create the virtual network, application subnet, private database subnet, route configuration, and least-privilege firewall rules from your design. Do not open SSH or RDP to the internet.
  done_when: The application subnet can receive intended application traffic, the database subnet has no public inbound path, and only the API workload can reach the database port.
  slug: phase4-topic3-practice-deploy-segmented-network
- uuid: a1667f65-7186-440e-9d94-2b263c941a14
  order: 7
  action: 'Practice:'
  title: Configure identity-aware VM access
  description: Deploy a VM without a public management port and connect through your provider's managed access service. Review the IAM permission required to start a session and locate the corresponding audit event.
  options:
  - provider: azure
    title: Connect through Azure Bastion
    url: https://learn.microsoft.com/azure/bastion/bastion-connect-vm-ssh-linux
    description: Connect to a private Linux VM through Azure Bastion.
  - provider: aws
    title: Connect through AWS Systems Manager Session Manager
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-systems-manager-session-manager.html
    description: Connect to EC2 without inbound ports or SSH keys.
  - provider: gcp
    title: Connect through IAP TCP forwarding
    url: https://docs.cloud.google.com/iap/docs/using-tcp-forwarding
    description: Connect to a private VM through an IAM-authorized tunnel.
  slug: phase4-topic3-practice-configure-identity-aware-access
- uuid: 062f4256-fb79-4d87-a114-60ca34f92c0d
  order: 8
  action: 'Practice:'
  title: Prove allowed and denied traffic paths
  description: Use provider diagnostics and connection tests to prove the intended application path works, the database is unreachable from the internet, and public SSH or RDP is blocked. Save the diagnostic results for your capstone design.
  slug: phase4-topic3-practice-prove-network-paths
- uuid: ca268dba-b19f-4c48-a31a-827c9ac6d4fa
  order: 9
  action: 'Practice:'
  title: Clean up your cloud resources
  description: Delete the test VM, managed access resources, virtual network, subnets, gateways, routes, and firewall rules unless you are immediately reusing them for the database topic. Confirm that no billable networking resources remain.
  slug: phase4-topic3-practice-clean-up-your-cloud
