# yaml-language-server: $schema=../../schemas/topic.schema.json
uuid: 1d920a98-5f15-4312-8fd1-39a32338b42f
slug: genai-apis
name: Generative AI APIs
description: Generative AI and Large Language Models (LLMs) are transforming how we build applications. In this topic, you'll provision access to a live model, configure an OpenAI Responses API-compatible endpoint, and verify structured output before integrating it into your Journal API.
learning_objectives:
- uuid: 3a23023a-af15-4252-8ec8-bbf11f317b51
  text: Understand core LLM API patterns including instructions, inputs, parameters, and structured outputs.
  order: 1
- uuid: 6cf52985-3c09-4695-92ff-111500551b5f
  text: Configure provider credentials and an OpenAI Responses API-compatible endpoint without exposing secrets.
  order: 2
- uuid: 33f17190-b658-40a0-b2aa-99474e1d84bb
  text: Validate a live model response that you can integrate into the Journal API analysis workflow.
  order: 3
learning_steps:
- uuid: bf840bef-8dad-4734-bbed-349753bc33b1
  order: 1
  action: 'Watch:'
  title: 'Python + AI: Large Language Models'
  url: https://www.youtube.com/live/X967IsYvhTM?si=qDi7Rcu8fN1UE5iE
  description: A strong intro session on LLM fundamentals, model options, the OpenAI Python SDK, streaming, chat history, prompt engineering, and async app patterns. Watch this first, then move to the hands-on demos.
  slug: phase3-topic4-watch-python-ai-large-language
- uuid: 8ee8e568-47e9-4012-94a0-1eac47bb4891
  order: 2
  action: 'Read:'
  title: Understand the Journal API AI analysis contract
  url: https://github.com/learntocloud/journal-starter#-ai-analysis-guide
  description: Review the required response shape, OpenAI Responses API client, environment variables, injected test client, and live verification workflow used by the Journal API.
  slug: phase3-topic4-read-understand-journal-api-ai-analysis
- uuid: 8ec7d5e6-e9d6-4221-9c7e-d002b17ef652
  order: 3
  action: 'Practice:'
  title: Provision access to a live model
  url: https://github.com/learntocloud/journal-starter#task-4-setup
  description: Create a Microsoft Foundry model deployment or obtain access to another endpoint supported by the Journal Starter's OpenAI Responses API client. Record the endpoint, API key, and model or deployment name without committing them to source control.
  slug: phase3-topic4-practice-provision-live-model
- uuid: d79f9515-404e-45cd-bad0-13229e37bd2b
  order: 4
  action: 'Practice:'
  title: Configure the live model endpoint
  url: https://github.com/learntocloud/journal-starter#task-4-setup
  description: Set `OPENAI_API_KEY`, `OPENAI_BASE_URL`, and `OPENAI_MODEL` in the Journal Starter's git-ignored `.env` file. Confirm the application loads the settings without printing or committing credentials.
  slug: phase3-topic4-practice-configure-live-model
- uuid: 4e4b6e66-ddea-4c46-b34d-dc864ce66349
  order: 5
  action: 'Practice:'
  title: Verify a live structured response
  url: https://github.com/learntocloud/journal-starter#task-4-setup
  description: Run `uv run python -m scripts.verify_llm` from your Journal Starter fork. Confirm the live provider returns an `AnalysisResponse` containing `entry_id`, `sentiment`, `summary`, and `topics`. This live check is required in addition to the mocked unit tests used by CI.
  slug: phase3-topic4-practice-verify-live-structured-response
