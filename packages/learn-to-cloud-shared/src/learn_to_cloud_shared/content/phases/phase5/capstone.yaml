# yaml-language-server: $schema=../../schemas/topic.schema.json
uuid: bcef3efa-8416-4ac8-a99e-eef16cd88e2a
slug: capstone
name: 'Capstone: DevOps Project'
description: Now that you've learned the fundamentals of DevOps, it's time to apply these practices to the Journal API app you built in Phase 3 and deployed in Phase 4. In this capstone, you'll containerize the app, automate its deployment, manage infrastructure as code, set up monitoring, and orchestrate containers with Kubernetes—demonstrating your end-to-end DevOps skills. The curriculum may not have covered everything you need — that's intentional. Researching what you don't know is part of the job.
short_description: Containerize your app with Docker, deploy to Kubernetes, automate with CI/CD, and instrument with OpenTelemetry for cloud-native observability.
learning_objectives:
- uuid: a8da24c4-65e0-45a6-88c3-f6ea7c851706
  text: Integrate containerization, CI/CD, IaC, and orchestration into one delivery workflow.
  order: 1
- uuid: a1c2cce3-b77b-428c-b308-4c76f93e06be
  text: Implement required DevOps project artifacts and deployment components correctly.
  order: 2
- uuid: f08ad590-a714-4327-b22c-4ab4cf99c5b0
  text: Document and communicate technical decisions and outcomes as portfolio-ready work.
  order: 3
learning_steps:
- uuid: e44b670a-c53c-4e31-8a6a-23fdc0729c6d
  order: 1
  action: 'Build:'
  title: Containerize the Application
  description: Package your Journal API as a Docker image that you can run locally and deploy to Kubernetes.
  checklist:
  - Use a suitable Python base image and reproducible dependency installation.
  - Keep secrets and unnecessary files out of the image.
  - Configure the container to start the API and accept traffic on port 8000.
  done_when: "`docker build` succeeds and `docker run` starts the API listening on port 8000."
  slug: phase5-topic6-build-containerize-the-application

- uuid: 340708fb-f0f4-438f-9058-e0c88dce33f4
  order: 2
  action: 'Build:'
  title: Infrastructure as Code
  description: Use Terraform to provision the infrastructure needed to run your containerized application on your chosen cloud provider.
  checklist:
  - Provision a container registry, managed Kubernetes cluster, and managed PostgreSQL database.
  - Configure the permissions and networking needed to pull images and connect to the database.
  - Initialize the database schema and protect credentials and Terraform state.
  done_when: "`terraform apply` completes, all resources exist, and you can connect to the database."
  slug: phase5-topic6-build-infrastructure-as-code

- uuid: a995972d-217d-487a-b9cf-4818ca9bd64e
  order: 3
  action: 'Build:'
  title: CI/CD Pipeline
  description: Extend `.github/workflows/ci.yml` from the CI/CD topic so pushes to `main` test, build, and deploy your application.
  checklist:
  - "**`test`** - Run linting and tests with the dependencies they need."
  - "**`build`** - Use `needs: test` to build and publish a commit-tagged container image after tests pass."
  - "**`deploy`** - Use `needs: build` to deploy that image to Kubernetes and wait for rollout to succeed."
  - "Use these exact job IDs and display names (`name: test`, `name: build`, `name: deploy`), with one of each and no matrix suffixes."
  - Use secure cloud authentication and keep credentials out of the repository.
  tips:
  - type: note
    text: Choose the actions and commands that fit your deployment. Your registry does not need to be public for verification.
  done_when: Pushing to `main` triggers the workflow, all three jobs pass, and Kubernetes runs the newly built image.
  slug: phase5-topic6-build-cicd-pipeline

- uuid: cddc7d25-1801-4d27-86a8-ba8317bbab8f
  order: 4
  action: 'Build:'
  title: Container Orchestration
  description: >-
    Write Kubernetes YAML manifests to deploy and expose your containerized
    application. Apply them from the pipeline using `kubectl`.
  checklist:
  - Create a Deployment using the image published by your pipeline and a Service that exposes the API.
  - Supply application configuration securely without committing real credentials.
  - Configure health probes and make the deploy job fail if rollout does not succeed.
  done_when: Kubernetes runs your app, health probes pass, and you can create and analyze a journal entry through the deployed API.
  slug: phase5-topic6-build-container-orchestration

- uuid: c77ee2ee-9913-49b5-8e46-e9258129e06e
  order: 5
  action: 'Build:'
  title: Monitoring & Observability
  description: Instrument your Journal API with OpenTelemetry so that logs, traces, and metrics are exported to your cloud provider's monitoring platform. This builds on the basic logging you added in Phase 3 by connecting all three telemetry signals into a unified, cloud-native observability pipeline. This step is not auto-verified but is essential for production readiness.
  checklist:
  - 'Install OpenTelemetry packages: `opentelemetry-api`, `opentelemetry-sdk`, `opentelemetry-instrumentation-fastapi`'
  - Configure a `TracerProvider` and `MeterProvider` with a `Resource` identifying your service
  - Call `FastAPIInstrumentor.instrument_app(app)` to auto-instrument HTTP requests
  - 'Add at least one custom span (e.g., around a database or LLM call) and one custom metric (e.g., entries created counter)'
  - Verify telemetry locally with an OTLP-compatible tool such as Aspire Dashboard before sending it to the cloud
  - 'Install your provider''s OTel exporter (`azure-monitor-opentelemetry`, `opentelemetry-exporter-otlp` for AWS/ADOT, or `opentelemetry-exporter-gcp-trace`/`opentelemetry-exporter-gcp-monitoring`)'
  - Configure the exporter so traces, metrics, and logs are sent to your cloud console (Azure Application Insights, AWS X-Ray + CloudWatch, or GCP Cloud Trace + Cloud Monitoring)
  - Query your telemetry in your provider's tool (Azure KQL, CloudWatch Logs Insights, or GCP Logs Explorer)
  - Build a small dashboard with request count, error rate, latency, and recent exceptions
  - Create one alert for repeated 5xx responses, high latency, or another user-impacting symptom
  - 'Optional advanced: recreate the same dashboard with Prometheus and Grafana'
  done_when: Traces, metrics, and logs from your Journal API are visible in your cloud provider's monitoring console, and you have a basic dashboard and alert.
  slug: phase5-topic6-build-monitoring-observability

- uuid: 3b4da54e-8bc3-4ff9-945a-85dd2d234d44
  order: 6
  action: 'Build:'
  title: Documentation
  description: Document your setup and deployment process so others can understand and reproduce your work. This step is not auto-verified but strengthens your portfolio.
  slug: phase5-topic6-build-documentation

- uuid: e080abdc-bf94-4e6b-a78e-33294ef28595
  order: 7
  action: 'Build:'
  title: Review Your Delivery Setup
  description: >-
    Confirm that your Docker image, Terraform infrastructure, Kubernetes
    manifests, and delivery pipeline work together. Document how to deploy,
    observe, and troubleshoot the application. Apart from the workflow path
    and job names used for verification, organize the files to suit your project.
  slug: phase5-topic6-build-required-project-structure
  tips:
  - type: note
    text: >-
      Automated verification uses run and job results only. It does not read
      source files, commands, or logs, or use AI review. A green job does not
      prove what its commands do; implementing these practices and checking
      the deployed application remain your responsibility.

- uuid: 1a7cde59-eecf-4078-ab74-d9a2a54f4351
  order: 8
  action: 'Practice:'
  title: Submit the DevOps capstone for verification
  description: >-
    Push your completed implementation to your fork. The latest run of
    `.github/workflows/ci.yml` must succeed on your current `main` commit,
    with exactly one successful job named `test`, `build`, and `deploy`.
    A failed, skipped, or missing job does not pass. Submit your fork for
    verification after the run finishes.
  tips:
  - type: note
    text: Choose Re-run all jobs if you rerun a workflow. Verification reads only the latest attempt, so rerunning just failed jobs may leave required jobs missing.
  done_when: The latest run and all three required jobs succeed on your current `main` commit, and your submission passes.
  slug: phase5-topic6-practice-submit-verification
- uuid: c43d5d38-c50f-40eb-af1b-c77cb41c4be2
  order: 9
  action: 'Reflect:'
  title: Share Your Progress
  description: When you've completed the capstone, push your work to GitHub! This becomes part of your portfolio. Consider sharing it on LinkedIn or with the Learn to Cloud community to get feedback and celebrate your progress.
  slug: phase5-topic6-reflect-share-your-progress

- uuid: 8136ecc2-60e2-4909-89ac-cb4d3592725e
  order: 10
  action: 'Practice:'
  title: Clean up your cloud resources
  description: After you have submitted your repo for hands-on verification and received a passing result, delete all cloud resources.
  checklist:
  - Kubernetes clusters
  - Container registries
  - Terraform-provisioned infrastructure (`terraform destroy`)
  - Any other billable resources
  tips:
  - type: tip
    text: Check your cloud console to confirm nothing is still running.
  slug: phase5-topic6-practice-clean-up-your-cloud
