# Pre-commit hooks for Learn to Cloud
# Requires: prek (brew install j178/tap/prek)
# Install: prek install
# Run all: prek run --all-files

repos:
  # Ruff - Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix]
        files: ^(api|packages/learn-to-cloud-shared(-test-support)?)/
      - id: ruff-format
        name: ruff format
        files: ^(api|packages/learn-to-cloud-shared(-test-support)?)/

  # ty - Python type checking
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: bash -c 'uv run --project api ty check --exclude scripts --exclude tests api && (cd packages/learn-to-cloud-shared && uv run --project . ty check --exclude tests .) && uv run --project packages/learn-to-cloud-shared-test-support ty check packages/learn-to-cloud-shared-test-support/src'
        language: system
        files: ^(api|packages/learn-to-cloud-shared(-test-support)?)/.*\.py$
        pass_filenames: false

  # squawk - migration SQL safety lint (mirrors the CI check exactly)
  - repo: local
    hooks:
      - id: squawk-migrations
        name: squawk migration SQL lint
        entry: bash -c 'cd api && uv run python scripts/lint_migration_sql.py'
        language: system
        files: ^api/alembic/versions/.*\.py$
        pass_filenames: false
  # General file hygiene + check-yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(api/htmlcov/|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: end-of-file-fixer
        exclude: ^(api/htmlcov/|.*\.svg$|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: check-json
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
