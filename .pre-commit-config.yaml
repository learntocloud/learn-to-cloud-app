# Pre-commit hooks for Learn to Cloud
# Requires: prek (brew install j178/tap/prek)
# Install: prek install
# Run all: prek run --all-files

repos:
  # Ruff - use the workspace version for linting and formatting
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # ty - Python type checking
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  # Migration lints: SQL safety (squawk) and filename/docstring conventions
  - repo: local
    hooks:
      - id: squawk-migrations
        name: squawk migration SQL lint
        entry: uv run python scripts/lint_migration_sql.py
        language: system
        files: ^src/learn_to_cloud/migrations/versions/.*\.py$
        pass_filenames: false
      - id: migration-naming
        name: migration naming lint
        entry: uv run python scripts/check_migration_naming.py
        language: system
        files: ^src/learn_to_cloud/migrations/versions/.*\.py$
        pass_filenames: false

  # Curriculum content: validate authored YAML and regenerate committed
  # artifacts. A regenerated file fails the hook, so drift cannot be committed.
  - repo: local
    hooks:
      - id: validate-content
        name: validate curriculum content
        entry: uv run python scripts/validate_content.py
        language: system
        files: ^src/learn_to_cloud/
        pass_filenames: false
      - id: generate-yaml-schemas
        name: regenerate curriculum YAML schemas
        entry: uv run python scripts/generate_yaml_schemas.py
        language: system
        files: ^src/learn_to_cloud/
        pass_filenames: false
      - id: compile-curriculum
        name: recompile curriculum.json
        entry: uv run python scripts/compile_curriculum.py
        language: system
        files: ^src/learn_to_cloud/
        pass_filenames: false
  # General file hygiene + check-yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(htmlcov/|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: end-of-file-fixer
        exclude: ^(htmlcov/|.*\.svg$|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: check-json
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
