# Pre-commit hooks for Learn to Cloud
# Requires: prek (brew install j178/tap/prek)
# Install: prek install
# Run all: prek run --all-files

repos:
  # Ruff - use the workspace version for linting and formatting
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run --project api ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
        args: [--fix]
        files: ^api/
      - id: ruff-format
        name: ruff format
        entry: uv run --project api ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
        files: ^api/

  # ty - Python type checking
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run --project api ty check api
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

  # squawk - migration SQL safety lint (mirrors the CI check exactly)
  - repo: local
    hooks:
      - id: squawk-migrations
        name: squawk migration SQL lint
        entry: bash -c 'cd api && uv run python scripts/lint_migration_sql.py'
        language: system
        files: ^api/alembic/versions/.*\.py$
        pass_filenames: false
  # General file hygiene + check-yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(api/htmlcov/|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: end-of-file-fixer
        exclude: ^(api/htmlcov/|.*\.svg$|\.github/workflows/.*\.lock\.yml$|\.github/workflows/agentics-maintenance\.yml$)
      - id: check-json
        exclude: ^\.vscode/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
